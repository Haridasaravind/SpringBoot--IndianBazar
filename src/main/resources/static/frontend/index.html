<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>IndianBazar - Home</title>
  <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
  <!-- Navigation -->
  <div class="navbar">
    <div class="left">
      <a href="/frontend/index.html">IndianBazar</a>
    </div>
    <div class="right" id="guest-nav">
      <a href="/frontend/login.html">Login</a>
      <a href="/frontend/signup.html">SignUp</a>
    </div>
    <div class="right" id="user-nav" style="display: none;">
      <a href="/frontend/index.html">Home</a>
      <a href="/frontend/categories.html">Categories</a>
      <a href="/frontend/cart.html">Cart</a>
      <a href="/frontend/orders.html">Orders</a>
      <a href="/frontend/MyAccont.html">My Account</a>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Home Content -->
  <div class="container home-content">
    <h1>Welcome to IndianBazar</h1>
    <p>Your one-stop shop for everyday essentials, electronics, clothing and more!</p>
  </div>

  <!-- Token Check Script -->
  <script>
    const token = localStorage.getItem("token");

    if (token) {
      document.getElementById("guest-nav").style.display = "none";
      document.getElementById("user-nav").style.display = "flex";
    } else {
      document.getElementById("guest-nav").style.display = "flex";
      document.getElementById("user-nav").style.display = "none";
    }

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/frontend/index.html";
    }
  </script>
  
  
  <div class="wrapper">
   <!-- Footer placeholder -->
    <div id="footer-placeholder"></div>

  <script>
    fetch("/frontend/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  </script>
  </div>
</body>
</html>
