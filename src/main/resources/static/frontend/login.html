<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - IndianBazar</title>
  <link rel="stylesheet" href="/frontend/styles.css">
</head>
<body>
  <!-- Navbar -->
  <div class="navbar">
    <div class="left">
      <a href="/frontend/index.html">IndianBazar</a>
    </div>
    <div class="right">
      <a href="/frontend/login.html">Login</a>
      <a href="/frontend/signup.html">SignUp</a>
    </div>
  </div>
			<!-- Login Form -->
			<div class="container">
			  <h1 style="text-align:center; color:#1976d2;">Login</h1>
			  <form id="loginForm">
			    <div class="form-group">
			      <label for="email">Email</label>
			      <input type="email" id="email" placeholder="Enter your email" required>
			    </div>
			
			    <div class="form-group">
			      <label for="password">Password</label>
			      <input type="password" id="password" placeholder="Enter your password" required>
			    </div>
			
			    <div class="form-group" style="text-align: center;">
			      <button type="submit">Login</button>
			    </div>
			  </form>
			</div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      fetch("http://localhost:2001/api/users/login", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ email, password })
      })
      .then(response => {
        if (!response.ok) throw new Error("Login failed");
        return response.json();
      })
      .then(data => {
        // Store dummy token temporarily
        localStorage.setItem("token", "dummy-token");
        alert("Login successful!");
        window.location.href = "/frontend/index.html";
      })
      .catch(err => {
        alert("Login failed: " + err.message);
      });
    });
  </script>
  
  <!-- Footer placeholder -->
    <div id="footer-placeholder"></div>

  <script>
    fetch("/frontend/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  </script>
</body>
</html>
