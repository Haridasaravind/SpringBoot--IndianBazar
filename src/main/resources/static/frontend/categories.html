<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Categories - IndianBazar</title>
  <link rel="stylesheet" href="/frontend/styles.css">
  <style>
    .category-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .category-card {
      background-color: #e3f2fd;
      padding: 20px;
      text-align: center;
      border-radius: 8px;
      font-weight: bold;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .category-card:hover {
      background-color: #bbdefb;
    }

    .category-card a {
      text-decoration: none;
      color: inherit;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Navigation -->
  <div class="navbar">
    <div class="left">
      <a href="/frontend/index.html">IndianBazar</a>
    </div>
    <div class="right">
      <a href="/frontend/index.html">Home</a>
      <a href="/frontend/categories.html">Categories</a>
      <a href="/frontend/cart.html">Cart</a>
      <a href="/frontend/orders.html">Orders</a>
      <a href="/frontend/myaccount.html">My Account</a>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <!-- Categories Content -->
  <div class="container">
    <h1>Shop by Categories</h1>
    <div id="categoryList" class="category-grid"></div>
  </div>

  <!-- JavaScript -->
  <script>
    // Redirect to login if not authenticated
    if (!localStorage.getItem("token")) {
      alert("Please login to view categories.");
      window.location.href = "/frontend/login.html";
    }

    const categories = [
      { name: "Electronics", link: "electronics.html" },
      { name: "Fashion", link: "fashion.html" },
      { name: "Grocery", link: "grocery.html" },
      { name: "Home & Kitchen", link: "home-kitchen.html" },
      { name: "Books", link: "books.html" },
      { name: "Toys", link: "toys.html" }
    ];

    const categoryList = document.getElementById("categoryList");

    categories.forEach(cat => {
      const anchor = document.createElement("a");
      anchor.href = cat.link;

      const div = document.createElement("div");
      div.className = "category-card";
      div.textContent = cat.name;

      anchor.appendChild(div);
      categoryList.appendChild(anchor);
    });

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/frontend/index.html";
    }
  </script>

  <!-- Footer -->
  <div id="footer-placeholder"></div>
  <script>
    fetch("/frontend/footer.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("footer-placeholder").innerHTML = data;
      });
  </script>

</body>
</html>
