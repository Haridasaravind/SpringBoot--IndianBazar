<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Products - IndianBazar</title>
  <link rel="stylesheet" href="/frontend/styles.css">
  <style>
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .product-card {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
      box-shadow: 2px 2px 8px rgba(0, 0, 0, 0.1);
    }

    .product-card img {
      max-width: 100%;
      height: auto;
    }

    .product-card h3 {
      margin: 10px 0 5px;
    }
  </style>
</head>
<body>

  <div class="navbar">
    <div class="left">
      <a href="/frontend/index.html">IndianBazar</a>
    </div>
    <div class="right">
      <a href="/frontend/index.html">Home</a>
      <a href="/frontend/categories.html">Categories</a>
      <a href="#">Cart</a>
      <a href="#">Orders</a>
      <a href="#">My Account</a>
      <button onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="container">
    <h2 id="categoryTitle">Category: </h2>
    <div id="productList" class="product-grid"></div>
    <p id="error" style="color: red;"></p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const category = urlParams.get("category");

    document.getElementById("categoryTitle").innerText += category;

    fetch(`/api/products/category/${category}`)
      .then(response => {
        if (!response.ok) {
          throw new Error("Failed to load products.");
        }
        return response.json();
      })
      .then(data => {
        const productList = document.getElementById("productList");
        if (data.length === 0) {
          document.getElementById("error").innerText = "No products found in this category.";
        } else {
          data.forEach(product => {
            const div = document.createElement("div");
            div.className = "product-card";
            div.innerHTML = `
              <img src="${product.imageUrl}" alt="${product.name}" />
              <h3>${product.name}</h3>
              <p>${product.description}</p>
              <p><strong>$${product.price}</strong></p>
            `;
            productList.appendChild(div);
          });
        }
      })
      .catch(error => {
        document.getElementById("error").innerText = "Error loading products.";
        console.error(error);
      });

    function logout() {
      localStorage.removeItem("token");
      window.location.href = "/frontend/index.html";
    }
  </script>

</body>
</html>
